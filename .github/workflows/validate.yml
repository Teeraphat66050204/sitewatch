name: Validate SiteWatch Emergency protocol
on:
  push:
    branches: [backup/demo-integration, Emergency-protocol]
  pull_request:

jobs:
  shell-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck netcat-openbsd curl
      - name: Shell syntax and ShellCheck
        run: |
          bash -n bin/sitewatch.sh bin/sitewatch-monitor.sh bin/sitewatch-run.sh bin/sitewatch-report.sh install.sh uninstall.sh tests/test-sitewatch.sh
          shellcheck bin/sitewatch.sh bin/sitewatch-monitor.sh bin/sitewatch-run.sh bin/sitewatch-report.sh install.sh uninstall.sh tests/test-sitewatch.sh
      - name: Check UP DOWN and transition-only alerts
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ci-sitewatch.conf <<'CONF'
          URLS=("http://127.0.0.1:8765")
          SERVICES=("127.0.0.1:8765")
          TIMEOUT=3
          HTTP_MIN=200
          HTTP_MAX=399
          CONF
          export SITEWATCH_DATA_DIR="$RUNNER_TEMP/sitewatch"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sitewatch-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          bash bin/sitewatch.sh -c /tmp/ci-sitewatch.conf 2>/tmp/sitewatch-1.log
          grep -q '"UP"' "$SITEWATCH_DATA_DIR/results.csv"
          kill "$server"
          wait "$server" || true
          bash bin/sitewatch.sh -c /tmp/ci-sitewatch.conf 2>/tmp/sitewatch-2.log
          grep -q 'ALERT:' /tmp/sitewatch-2.log
          bash bin/sitewatch.sh -c /tmp/ci-sitewatch.conf 2>/tmp/sitewatch-3.log
          if grep -q 'ALERT:' /tmp/sitewatch-3.log; then
            echo "Repeated alert on unchanged DOWN status" >&2
            exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sitewatch-http2.log 2>&1 &
          server=$!
          sleep 1
          bash bin/sitewatch.sh -c /tmp/ci-sitewatch.conf 2>/tmp/sitewatch-4.log
          grep -q 'RECOVERY:' /tmp/sitewatch-4.log
          bash bin/sitewatch-report.sh "$SITEWATCH_DATA_DIR/results.csv"
          test "$(wc -l < "$SITEWATCH_DATA_DIR/results.csv")" -eq 9
          bash bin/sitewatch-report.sh "$SITEWATCH_DATA_DIR/results.csv" | grep -E '^OVERALL[[:space:]]+4[[:space:]]+8[[:space:]]+50[.]00$'
          bash bin/sitewatch.sh -h >/dev/null
          bash bin/sitewatch.sh -n -c /tmp/ci-sitewatch.conf >/dev/null
          if bash bin/sitewatch.sh -c /tmp/not-here-sitewatch.conf; then
            echo "Missing config should fail" >&2
            exit 1
          fi
          set +e
          bash bin/sitewatch.sh -z >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Run standalone smoke test
        run: bash tests/test-sitewatch.sh
      - name: Test clean installer and uninstaller with isolated systemctl stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mockbin"
          cat > "$RUNNER_TEMP/mockbin/systemctl" <<'SH'
          #!/bin/sh
          printf 'MOCK systemctl %s\n' "$*" >> /tmp/sitewatch-install-test.log
          exit 0
          SH
          chmod 755 "$RUNNER_TEMP/mockbin/systemctl"
          sudo env PATH="$RUNNER_TEMP/mockbin:$PATH" bash install.sh
          sudo env PATH="$RUNNER_TEMP/mockbin:$PATH" bash install.sh
          sudo test -f /usr/local/lib/sitewatch/bin/sitewatch.sh
          sudo test -f /usr/local/lib/sitewatch/bin/sitewatch-monitor.sh
          sudo test -f /etc/sitewatch/sitewatch.conf
          sudo test -f /etc/systemd/system/sitewatch.timer
          sudo test -f /etc/systemd/system/sitewatch.service
          grep -q 'Type=oneshot' systemd/sitewatch.service
          grep -q 'OnUnitInactiveSec=3min' systemd/sitewatch.timer
          sudo env PATH="$RUNNER_TEMP/mockbin:$PATH" bash uninstall.sh --purge
          sudo test ! -e /usr/local/lib/sitewatch
          sudo test ! -e /etc/sitewatch/sitewatch.conf
          sudo test ! -e /var/lib/sitewatch
          sudo env PATH="$RUNNER_TEMP/mockbin:$PATH" bash uninstall.sh --purge
